[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "src"
version = "0.1.0"
description = "Shared utility library for Learning-to-Rank experiments (LETOR4 / MQ2008 / MSLR-WEB10K)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch",
    "numpy",
    "scipy",
    "scikit-learn",
    "tqdm",
    "matplotlib",
    "pandas",
    "seaborn",
]

[tool.setuptools.packages.find]
where = ["."]
